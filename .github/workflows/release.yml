# Release build from public CI (#20, D15): universal Mac app + DMG, the Windows recorder as an NSIS
# installer (#17, unsigned for now: owner decision #25), SHA-256 checksums, one draft GitHub release.
# Runs on a version tag (v0.2.0) or by hand. Mac signing has three modes, picked from the secrets:
#   developer-id  APPLE_CERTIFICATE + APPLE_ID (+ APPLE_PASSWORD, APPLE_TEAM_ID): signed and notarized.
#   self-signed   APPLE_CERTIFICATE only (owner decision #23, 2026-11-08: no paid Apple program).
#                 The cert is free and self-made, so Gatekeeper still asks once ("Open Anyway"), but the
#                 signature stays the same across releases and macOS keeps Input Monitoring and
#                 Accessibility granted after an update. Backup: MACSIGN_* in .scaffold-secrets.
#   ad-hoc        no secrets: every build looks like a new app to macOS.
# The draft says which one it is; it is never published automatically.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Tests first
        run: |
          npm test
          cd apps/desktop/src-tauri && cargo test --locked
      - name: Signing mode
        id: mode
        run: |
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_ID" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$APPLE_CERTIFICATE" ]; then
            echo "signed=self" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No Apple secrets: building an ad-hoc signed, un-notarized draft."
          fi
      - name: Build universal app and DMG
        working-directory: apps/desktop
        run: |
          if [ "${{ steps.mode.outputs.signed }}" = self ]; then
            # Self-made certificate: Tauri only signs with identities macOS calls valid, and an
            # untrusted self-made one is not, so build unsigned here and sign in the next step.
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
            export APPLE_SIGNING_IDENTITY=-
            npm ci
            npx tauri build --target universal-apple-darwin --bundles app
            exit 0
          elif [ "${{ steps.mode.outputs.signed }}" != true ]; then
            # Missing secrets still arrive as empty variables, and Tauri then tries to import an empty
            # certificate. Unset them and sign ad-hoc ("-") instead.
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
            export APPLE_SIGNING_IDENTITY=-
          fi
          npm ci
          npx tauri build --target universal-apple-darwin --bundles app,dmg
      - name: Sign with the self-made certificate and build the DMG
        if: steps.mode.outputs.signed == 'self'
        run: |
          B=apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle
          KC="$RUNNER_TEMP/cmdnudge.keychain-db"; KP=$(openssl rand -hex 12)
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/c.p12"
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KP" "$KC"
          security import "$RUNNER_TEMP/c.p12" -k "$KC" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KP" "$KC" >/dev/null
          rm "$RUNNER_TEMP/c.p12"
          codesign --force --deep --options runtime --keychain "$KC" -s "$APPLE_SIGNING_IDENTITY" "$B/macos/cmdnudge.app"
          VERSION=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          mkdir -p "$RUNNER_TEMP/dmg" "$B/dmg"
          ditto "$B/macos/cmdnudge.app" "$RUNNER_TEMP/dmg/cmdnudge.app"
          ln -s /Applications "$RUNNER_TEMP/dmg/Applications"
          hdiutil create -volname cmdnudge -srcfolder "$RUNNER_TEMP/dmg" -ov -format UDZO "$B/dmg/cmdnudge_${VERSION}_universal.dmg"
          codesign --force --keychain "$KC" -s "$APPLE_SIGNING_IDENTITY" "$B/dmg/cmdnudge_${VERSION}_universal.dmg"
          security delete-keychain "$KC"
      - name: Verify signature
        run: |
          APP=apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/cmdnudge.app
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -d -r- "$APP"
          if [ "${{ steps.mode.outputs.signed }}" = true ]; then
            spctl --assess --type execute --verbose "$APP"
            xcrun stapler validate "$APP"
          fi
      - name: Collect
        id: files
        run: |
          mkdir -p out
          VERSION=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          cp apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg "out/cmdnudge-$VERSION-mac-universal.dmg"
          echo "${{ steps.mode.outputs.signed }}" > out/mac-signed.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: out/

  windows:
    # Unsigned until a code-signing certificate exists (#25): SmartScreen asks "Run anyway".
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Tests first
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked
      - name: Build installer
        working-directory: apps/desktop
        run: |
          npm ci
          npx tauri build --bundles nsis
      - name: Collect
        shell: bash
        run: |
          mkdir -p out
          VERSION=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          cp apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe "out/cmdnudge-$VERSION-windows-x64-setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/

  release:
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dl
      - name: Checksums
        id: files
        run: |
          mkdir -p out
          cp dl/mac/*.dmg dl/windows/*.exe out/
          echo "signed=$(cat dl/mac/mac-signed.txt)" >> "$GITHUB_OUTPUT"
          (cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          echo "version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in v*) ;; *) TAG="v${{ steps.files.outputs.version }}-ci.${GITHUB_RUN_NUMBER}" ;; esac
          if [ "${{ steps.files.outputs.signed }}" = true ]; then
            NOTE="Mac: signed with Developer ID and notarized by Apple."
          elif [ "${{ steps.files.outputs.signed }}" = self ]; then
            NOTE="Mac: signed with the cmdnudge certificate, not notarized by Apple. The first time, macOS says it cannot check the app: open System Settings → Privacy & Security and click \"Open Anyway\". Updates keep your permissions."
          else
            NOTE="Mac: ad-hoc signature, not notarized. The first time, open System Settings → Privacy & Security and click \"Open Anyway\"; after an update, grant Input Monitoring and Accessibility again."
          fi
          NOTE="$NOTE Windows: the recorder installer is not code-signed yet; SmartScreen shows \"More info → Run anyway\". Built by GitHub Actions run ${GITHUB_RUN_ID} from commit ${GITHUB_SHA}."
          printf '%s\n\nSHA-256:\n```\n%s\n```\n' "$NOTE" "$(cat out/SHA256SUMS.txt)" > notes.md
          gh release create "$TAG" out/* --draft --title "cmdnudge $TAG" --notes-file notes.md --target "$GITHUB_SHA"
