name: issue status

# ONE job, and no push trigger (owner decision 2026-11-17). GitHub bills every job as at least one
# whole minute; the push trigger cost ~1,240 minutes in 14 days across the fleet (28 % of the
# account). What it did on push now happens locally:
#   - the #N check on feat:/fix: commits is the pre-push hook (check-commit-issue-refs.mjs --pre-push);
#   - the label moves (alpha -> on-alpha, beta -> on-beta, main -> released, closes) are
#     `tools/issue-status.mjs --from-pre-push`, called by the same hook, which waits for the push to
#     land and then moves the labels with the pusher's own gh login.
#
#   pull_request       check that every feat:/fix: commit cites its issue (#N)
#   workflow_dispatch  manual BACKFILL of the label moves for a range the local run missed
#                      (inputs: branch alpha|beta|main, range <base>..<head>); default GITHUB_TOKEN
on:
  pull_request:
    branches: [alpha, beta, main]
  workflow_dispatch:
    inputs:
      branch:
        description: Branch the range landed on (alpha, beta or main)
        required: true
        default: alpha
      range:
        description: Git range of the commits to move issues for, <base>..<head>
        required: true

permissions:
  contents: read
  issues: write

jobs:
  issues:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update issues
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ inputs.branch }}
          RANGE: ${{ inputs.range }}
        run: |
          node tools/issue-status.mjs --repo "$GITHUB_REPOSITORY" --branch "$BRANCH" --range "$RANGE" || true
          exit 0
      - name: Check commit issue references
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node tools/check-commit-issue-refs.mjs "origin/${BASE_REF}..${PR_HEAD}"
