# Checks every push and pull request: habit map, Rust core (filter, matcher, sync), desktop UI types,
# website build, and the Windows recorder (#17) compiled and tested on Windows.
# Actions minutes (owner decision 2026-11-17): Linux runs on every push to alpha/beta/main and on pull
# requests; the macOS (bills 10x) and Windows jobs run only on a version tag, on main and by hand.
# A push that only touches docs (**.md, docs/**) skips everything.
name: ci

on:
  push:
    branches: [alpha, beta, main]
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  library-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # node:sqlite without a flag, for the sync server tests
      - name: Habit map tests
        run: npm test
      - name: Generated library.json is up to date
        run: |
          npm run library
          git diff --exit-code packages/library/dist/library.json
      - name: Website build
        run: node apps/web/build.mjs

  desktop:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: UI type check and build
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build
      - name: Rust tests
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked

  windows:
    # The Windows recorder (#17): builds the app for Windows and runs the Rust tests there
    # (chord mapping, family lookup, sync), so the cfg(windows) hook code cannot rot unseen.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: UI build
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build
      - name: Rust tests
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked
      - name: Keyboard hook on a real Windows desktop (prints which checks ran)
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked win::tests -- --nocapture
